<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a12;--card:#1a1a2e;--card2:#16213e;--border:#2a2a4a;
  --text:#e2e8f0;--muted:#94a3b8;--accent:#2496ed;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;--gray:#6b7280;
}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",sans-serif;font-size:13px;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar h1{font-size:14px;font-weight:600;color:var(--accent)}
#search{flex:1;max-width:280px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text);font-size:12px;outline:none}
#search:focus{border-color:var(--accent)}
#refresh-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 10px;cursor:pointer;font-size:12px}
#refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
#last-updated{color:var(--muted);font-size:11px;margin-left:auto}
#host-tabs{display:flex;gap:4px;padding:6px 14px 0;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:5px 14px;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;cursor:pointer;font-size:12px;color:var(--muted);background:var(--bg);transition:all .15s;display:flex;align-items:center;gap:6px}
.tab.active{background:var(--card2);border-color:var(--border);color:var(--text)}
.tab:hover:not(.active){color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:10px 14px}
#table-wrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse}
thead th{background:var(--card);color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:7px 10px;text-align:left;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
thead th.sort-asc::after{content:" ▲";font-size:9px}
thead th.sort-desc::after{content:" ▼";font-size:9px}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:rgba(255,255,255,.03)}
td{padding:7px 10px;vertical-align:middle}
td.name{font-weight:500;cursor:pointer;color:var(--accent)}
td.name:hover{text-decoration:underline}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500}
.badge-running{background:rgba(34,197,94,.15);color:var(--green)}
.badge-exited,.badge-stopped{background:rgba(239,68,68,.12);color:var(--red)}
.badge-paused{background:rgba(234,179,8,.12);color:var(--yellow)}
.badge-created,.badge-dead{background:rgba(107,114,128,.15);color:var(--gray)}
.badge-restarting{background:rgba(36,150,237,.12);color:var(--accent)}
.bar-wrap{display:flex;align-items:center;gap:5px;min-width:80px}
.bar{height:5px;border-radius:3px;background:var(--border);flex:1}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .4s}
.bar-fill.warn{background:var(--yellow)}.bar-fill.hot{background:var(--red)}
.bar-val{font-size:11px;color:var(--muted);white-space:nowrap;min-width:35px}
.ports{display:flex;flex-wrap:wrap;gap:3px}
.port-badge{background:rgba(36,150,237,.1);color:var(--accent);border:1px solid rgba(36,150,237,.2);border-radius:4px;padding:1px 5px;font-size:10px;font-family:monospace}
.actions{display:flex;gap:4px}
.act{background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);padding:3px 8px;cursor:pointer;font-size:11px;transition:all .15s}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act.start:hover{border-color:var(--green);color:var(--green)}
.act.stop:hover{border-color:var(--red);color:var(--red)}
.act.restart:hover{border-color:var(--yellow);color:var(--yellow)}
#log-panel{position:fixed;top:0;right:-480px;width:480px;height:100vh;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:right .25s;z-index:100}
#log-panel.open{right:0}
#log-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
#log-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
#log-body{flex:1;overflow-y:auto;padding:10px 12px;font-family:monospace;font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
#log-footer{padding:6px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);flex-shrink:0}
#confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center}
#confirm-overlay.open{display:flex}
#confirm-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:380px;width:90%;text-align:center}
#confirm-box h3{margin-bottom:8px}
#confirm-box p{color:var(--muted);font-size:13px;margin-bottom:20px}
#confirm-btns{display:flex;gap:8px;justify-content:center}
.cbtn{padding:7px 20px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:13px}
.cbtn.cancel{background:none;color:var(--muted)}
.cbtn.danger{background:var(--red);border-color:var(--red);color:#fff}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.ansi-31{color:#ef4444}.ansi-32{color:#22c55e}.ansi-33{color:#eab308}.ansi-34{color:#3b82f6}
.ansi-35{color:#a855f7}.ansi-36{color:#06b6d4}.ansi-37{color:#e2e8f0}.ansi-90{color:#6b7280}
.ansi-91{color:#f87171}.ansi-92{color:#4ade80}.ansi-93{color:#fde047}.ansi-94{color:#60a5fa}
.ansi-95{color:#c084fc}.ansi-96{color:#22d3ee}.ansi-1{font-weight:bold}.ansi-2{opacity:.7}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div id="topbar">
  <h1>&#x1F433; Docker Panel</h1>
  <input id="search" type="text" placeholder="Filter by name or image..." oninput="filterContainers()">
  <button id="refresh-btn" onclick="doRefresh()">&#x21BB; Refresh</button>
  <span id="last-updated"></span>
</div>

<div id="host-tabs"></div>

<div id="main">
  <div id="table-wrap">
    <table>
      <thead><tr>
        <th onclick="sortBy('Names')" data-col="Names">Name</th>
        <th onclick="sortBy('Image')" data-col="Image">Image</th>
        <th onclick="sortBy('State')" data-col="State">Status</th>
        <th>CPU%</th><th>Memory</th><th>Ports</th>
        <th onclick="sortBy('host')" data-col="host">Host</th>
        <th>Actions</th>
      </tr></thead>
      <tbody id="container-body"></tbody>
    </table>
  </div>
</div>

<div id="log-panel">
  <div id="log-header">
    <span id="log-title">Logs</span>
    <button id="log-close" onclick="closeLogs()">&#x2715;</button>
  </div>
  <div id="log-body"></div>
  <div id="log-footer">
    <label><input type="checkbox" id="follow-chk" checked> Auto-scroll</label>
    <span id="log-lines"></span>
  </div>
</div>

<div id="confirm-overlay">
  <div id="confirm-box">
    <h3 id="confirm-title">Confirm</h3>
    <p id="confirm-msg"></p>
    <div id="confirm-btns">
      <button class="cbtn cancel" onclick="confirmCancel()">Cancel</button>
      <button class="cbtn danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
// State
var C=[],ST={},H=[],AH="all",FT="",SC="Names",SD=1,SSE=null,LLC=0,CB=null;

// Boot
function init(){loadH();loadC();connectWS();setInterval(loadC,15000);}
function doRefresh(){loadC();}

// Load hosts
async function loadH(){
  try{var r=await fetch("/api/hosts");H=await r.json()||[];drawTabs();}
  catch(e){console.warn("loadH",e);}
}

// Render host tabs
function drawTabs(){
  var el=document.getElementById("host-tabs");
  var html="";
  var allActive=(AH=="all")?" active":"";
  html+="<div class='tab"+allActive+"' onclick='setH(\"all\")'><span class='dot ok'></span>All Hosts</div>";
  H.forEach(function(x){
    var act=(AH==x.name)?" active":"";
    var cls=x.reachable?"ok":"err";
    html+="<div class='tab"+act+"' onclick='setH(\""+ea(x.name)+"\")'><span class='dot "+cls+"'></span>"+eh(x.label||x.name)+"</div>";
  });
  el.innerHTML=html;
}
function setH(n){AH=n;drawTabs();drawTable();}

// Load containers + stats
async function loadC(){
  try{
    var [r1,r2]=await Promise.all([fetch("/api/containers"),fetch("/api/stats")]);
    C=await r1.json()||[];
    var sa=await r2.json()||[];
    ST={};sa.forEach(function(x){ST[x.host+"/"+x.Name]=x;});
    drawTable();
    document.getElementById("last-updated").textContent="Updated "+new Date().toLocaleTimeString();
  }catch(e){console.warn("loadC",e);}
}
function filterContainers(){FT=document.getElementById("search").value.toLowerCase();drawTable();}

// Sorting
function sortBy(col){
  SC==col?SD*=-1:(SC=col,SD=1);
  document.querySelectorAll("thead th").forEach(function(t){
    t.classList.remove("sort-asc","sort-desc");
    if(t.dataset.col==col)t.classList.add(SD==1?"sort-asc":"sort-desc");
  });
  drawTable();
}
function visible(){
  var l=C.slice();
  if(AH!="all")l=l.filter(function(c){return c.host==AH;});
  if(FT)l=l.filter(function(c){
    return(c.Names||"").toLowerCase().includes(FT)||(c.Image||"").toLowerCase().includes(FT);
  });
  l.sort(function(a,b){
    var av=(a[SC]||"").toLowerCase(),bv=(b[SC]||"").toLowerCase();
    return av<bv?-SD:av>bv?SD:0;
  });
  return l;
}

// Render table
function drawTable(){
  var body=document.getElementById("container-body"),list=visible(),html="";
  if(!list.length){
    body.innerHTML="<tr><td colspan='8' style='text-align:center;color:var(--muted);padding:30px'><span class='spinner'></span>No containers found</td></tr>";
    return;
  }
  list.forEach(function(c){
    var k=c.host+"/"+c.Names,st=ST[k]||{};
    var cp=pp(st.CPUPerc),mp=pp(st.MemPerc);
    var ccl=cp>80?"hot":cp>50?"warn":"",mcl=mp>80?"hot":mp>50?"warn":"";
    var state=(c.State||"").toLowerCase(),run=state=="running";
    var ci=ea(c.ID),cn=ea(c.Names),ch=ea(c.host);
    html+="<tr>";
    html+="<td class='name' onclick='openLogs(\""+ch+"\",\""+ci+"\",\""+cn+"\")'  >"+eh(c.Names)+"</td>";
    html+="<td style='color:var(--muted);font-size:11px'>"+eh(si(c.Image))+"</td>";
    html+="<td><span class='badge badge-"+state+"'>"+eh(c.State||"?")+"</span></td>";
    html+="<td><div class='bar-wrap'><div class='bar'><div class='bar-fill "+ccl+"' style='width:"+cp+"%'></div></div><span class='bar-val'>"+(st.CPUPerc||"&mdash;")+"</span></div></td>";
    html+="<td><div class='bar-wrap'><div class='bar'><div class='bar-fill "+mcl+"' style='width:"+mp+"%'></div></div><span class='bar-val' style='min-width:80px'>"+(st.MemUsage||"&mdash;")+"</span></div></td>";
    html+="<td><div class='ports'>"+pp2(c.Ports)+"</div></td>";
    html+="<td style='color:var(--muted)'>"+eh(c.host)+"</td>";
    html+="<td class='actions'>";
    html+=run
      ?"<button class='act stop' onclick='doAct(\""+ch+"\",\""+ci+"\",\""+cn+"\",\"stop\")' title='Stop'>&#x23F9;</button>"
      :"<button class='act start' onclick='doAct(\""+ch+"\",\""+ci+"\",\""+cn+"\",\"start\")' title='Start'>&#x25B6;</button>";
    html+="<button class='act restart' onclick='doAct(\""+ch+"\",\""+ci+"\",\""+cn+"\",\"restart\")' title='Restart'>&#x21BA;</button>";
    html+="<button class='act' onclick='doAct(\""+ch+"\",\""+ci+"\",\""+cn+"\",\"remove\")' title='Remove' style='color:#ef4444'>&#x1F5D1;</button>";
    html+="</td></tr>";
  });
  body.innerHTML=html;
}

// Container actions
function doAct(host,id,name,action){
  if(action=="stop"||action=="remove"){
    var msg=action=="remove"
      ?"Remove <b>"+eh(name)+"</b> from <b>"+eh(host)+"</b>? Cannot be undone."
      :"Stop <b>"+eh(name)+"</b> on <b>"+eh(host)+"</b>?";
    showConfirm(action=="remove"?"Remove Container":"Stop Container",msg,function(){runAct(host,id,action);});
  }else runAct(host,id,action);
}
async function runAct(host,id,action){
  var method=action=="remove"?"DELETE":"POST";
  var url=action=="remove"?"/api/containers/"+host+"/"+id:"/api/containers/"+host+"/"+id+"/"+action;
  try{
    var r=await fetch(url,{method:method});
    if(!r.ok){var e=await r.json();alert("Error: "+(e.error||r.statusText));}
    setTimeout(loadC,1200);
  }catch(e){alert("Request failed: "+e.message);}
}

// Log viewer
function openLogs(host,id,name){
  closeLogs();LLC=0;
  document.getElementById("log-title").textContent=name+" @ "+host;
  document.getElementById("log-body").innerHTML="";
  document.getElementById("log-panel").classList.add("open");
  SSE=new EventSource("/api/containers/"+host+"/"+id+"/logs/stream?tail=200");
  SSE.onmessage=function(e){addLog(e.data);};
  SSE.onerror=function(){addLog("\n[stream ended]");SSE.close();};
}
function closeLogs(){
  if(SSE){SSE.close();SSE=null;}
  document.getElementById("log-panel").classList.remove("open");
  document.getElementById("log-body").innerHTML="";
  LLC=0;
}
function addLog(line){
  var body=document.getElementById("log-body");
  var s=document.createElement("span");
  s.innerHTML=ansi(eh(line))+"\n";
  body.appendChild(s);LLC++;
  document.getElementById("log-lines").textContent=LLC+" lines";
  if(document.getElementById("follow-chk").checked)body.scrollTop=body.scrollHeight;
}

// WebSocket for live stats
function connectWS(){
  var ws=new WebSocket("ws://"+location.host+"/ws");
  ws.onmessage=function(e){
    try{
      var m=JSON.parse(e.data);
      if(m.type=="stats"&&m.data){
        ST={};m.data.forEach(function(s){ST[s.host+"/"+s.Name]=s;});
        drawTable();
      }
    }catch(x){}
  };
  ws.onclose=function(){setTimeout(connectWS,5000);};
  ws.onerror=function(){ws.close();};
}

// Confirm dialog
function showConfirm(t,m,cb){
  document.getElementById("confirm-title").textContent=t;
  document.getElementById("confirm-msg").innerHTML=m;
  document.getElementById("confirm-overlay").classList.add("open");
  CB=cb;
}
function confirmCancel(){
  document.getElementById("confirm-overlay").classList.remove("open");
  CB=null;
}
document.getElementById("confirm-ok").onclick=function(){
  document.getElementById("confirm-overlay").classList.remove("open");
  if(CB){CB();CB=null;}
};

// Utility helpers
function eh(s){
  if(!s)return"";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function ea(s){
  if(!s)return"";
  return String(s).replace(/\\/g,"\\\\").replace(/"/g,"&quot;");
}
function si(img){
  if(!img)return"";
  var p=img.split("/");
  return p[p.length-1].substring(0,40);
}
function pp(s){if(!s)return 0;return parseFloat(s.replace("%",""))||0;}
function pp2(ports){
  if(!ports)return"";
  var seen={},badges=[],re=/([\d.]+:)?(\d+)->(\d+)\/\w+/g,m;
  while((m=re.exec(ports))!=null){
    if(!seen[m[2]]){seen[m[2]]=1;badges.push("<span class='port-badge'>"+m[2]+"&rarr;"+m[3]+"</span>");}
    if(badges.length>=4)break;
  }
  return badges.join("");
}

// ANSI color escape sequences to HTML spans
function ansi(text){
  var cm={"31":"ansi-31","32":"ansi-32","33":"ansi-33","34":"ansi-34","35":"ansi-35",
    "36":"ansi-36","37":"ansi-37","90":"ansi-90","91":"ansi-91","92":"ansi-92",
    "93":"ansi-93","94":"ansi-94","95":"ansi-95","96":"ansi-96","1":"ansi-1","2":"ansi-2"};
  var r="",o=0,parts=text.split(/\x1b\[([0-9;]*)m/);
  for(var i=0;i<parts.length;i++){
    if(i%2==0){r+=parts[i];}
    else{
      var cs=parts[i].split(";");
      for(var j=0;j<cs.length;j++){
        var c=cs[j];
        if(c=="0"||c==""){while(o>0){r+="</span>";o--;}}
        else if(cm[c]){r+="<span class='"+cm[c]+"'>";o++;}
      }
    }
  }
  while(o>0){r+="</span>";o--;}
  return r;
}

init();
</script>
</body>
</html>
