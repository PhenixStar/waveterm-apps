<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --wave-header: 0px;
    --bg:          #0a0a12;
    --surface:     #111124;
    --card-bg:     #16162e;
    --card-border: #232345;
    --card-hover:  #1e1e3a;
    --text:        #c8ccd4;
    --text-bright: #e8ecf4;
    --muted:       #5a6077;
    --cyan:        #06b6d4;
    --green:       #10b981;
    --yellow:      #eab308;
    --red:         #ef4444;
    --purple:      #8b5cf6;
    --bar-bg:      #0d0d1a;
    --radius:      6px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
    padding-top: var(--wave-header);
  }

  /* ── Header bar ─────────────────────────────────────── */
  .bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--card-border);
    gap: 12px;
    z-index: 10;
  }

  .bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bar h1 {
    font-size: 11px;
    font-weight: 600;
    color: var(--cyan);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .bar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--bar-bg);
    border: 1px solid var(--card-border);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .chip-green { color: var(--green); border-color: rgba(16,185,129,0.3); }
  .chip-red   { color: var(--red);   border-color: rgba(239,68,68,0.3); }
  .chip-ws    { color: var(--muted); }
  .chip-ws.live { color: var(--green); border-color: rgba(16,185,129,0.3); }
  .chip-ws.dead { color: var(--red);   border-color: rgba(239,68,68,0.3); }

  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot-g { background: var(--green); }
  .dot-r { background: var(--red); }

  .ts { color: var(--muted); font-size: 10px; }

  /* ── Grid ────────────────────────────────────────────── */
  .grid-wrap {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--card-border) transparent;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }

  /* ── Card ────────────────────────────────────────────── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 10px 12px;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
    cursor: default;
    overflow: hidden;
  }
  .card:hover { background: var(--card-hover); border-color: var(--cyan); }
  .card.offline { opacity: 0.5; }
  .card.offline:hover { border-color: var(--red); }

  .card-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    transition: background 0.3s;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .card-name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-bright);
  }

  .s-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .s-ok   { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .s-warn { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .s-crit { background: var(--red); box-shadow: 0 0 6px var(--red); animation: pulse 1.5s infinite; }
  .s-unk  { background: var(--muted); }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.3; }
  }

  .type-tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bar-bg);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── Metrics ─────────────────────────────────────────── */
  .metrics { display: flex; flex-direction: column; gap: 5px; }

  .m-row {
    display: grid;
    grid-template-columns: 32px 1fr 42px;
    align-items: center;
    gap: 5px;
    font-size: 11px;
  }
  .m-lbl { color: var(--muted); font-size: 10px; }
  .m-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-bright); }

  .bar-t {
    height: 5px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-f {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease, background 0.3s;
  }
  .b-ok   { background: var(--green); }
  .b-warn { background: var(--yellow); }
  .b-crit { background: var(--red); }

  /* ── Sparkline ───────────────────────────────────────── */
  .spark { height: 32px; margin-top: 6px; }
  .spark canvas { width: 100% !important; height: 32px !important; }

  /* ── GPU section ─────────────────────────────────────── */
  .gpu-sec {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--card-border);
  }
  .gpu-tag {
    font-size: 9px;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }

  /* ── Footer ──────────────────────────────────────────── */
  .card-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid var(--card-border);
    font-size: 10px;
    color: var(--muted);
  }
  .foot-v { color: var(--text); }

  /* ── Offline ─────────────────────────────────────────── */
  .off-msg { text-align: center; padding: 8px 0; color: var(--red); font-size: 11px; }
  .off-ts  { text-align: center; color: var(--muted); font-size: 10px; }

  /* ── SSH tooltip ─────────────────────────────────────── */
  .ssh-tip {
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    background: var(--bar-bg);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .card:hover .ssh-tip { opacity: 0.9; }

  /* ── Placeholder ─────────────────────────────────────── */
  .ph {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 30px 0;
    font-size: 11px;
  }
  .ph::before { content: '◇ '; color: var(--cyan); }

  /* ── Focus ring (tab-in-focus indicator) ─────────────── */
  .focused-ring {
    display: none;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 4px var(--cyan);
    animation: breathe 2s infinite;
  }
  .tab-focused .focused-ring { display: inline-block; }
  @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-left">
    <h1>infra</h1>
    <span class="focused-ring" title="Real-time (tab focused)"></span>
  </div>
  <div class="bar-right">
    <span class="chip chip-green"><span class="dot dot-g"></span> <span id="n-on">0</span></span>
    <span class="chip chip-red"><span class="dot dot-r"></span> <span id="n-off">0</span></span>
    <span class="chip chip-ws" id="ws-chip">connecting</span>
    <span class="ts" id="ts">--</span>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid" id="g">
    <div class="ph" id="ph">Connecting to backend...</div>
  </div>
</div>

<script>
// ── Utilities ────────────────────────────────────────────
const $ = s => document.getElementById(s);
const el = (t,c) => { const e = document.createElement(t); if(c) e.className=c; return e; };

function fmtB(b) {
  if(!b) return '0B';
  const u=['B','K','M','G','T']; let v=b, i=0;
  while(v>=1024&&i<u.length-1){v/=1024;i++}
  return i===0?b+'B':v.toFixed(1)+u[i];
}
function fmtUp(s) {
  if(!s||s<=0) return '-';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d>0?d+'d '+h+'h':h>0?h+'h '+m+'m':m+'m';
}
function fmtAgo(iso) {
  if(!iso) return '?';
  const d=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  return d<60?d+'s ago':d<3600?Math.floor(d/60)+'m ago':Math.floor(d/3600)+'h ago';
}
function bCls(p) { return p>=95?'b-crit':p>=80?'b-warn':'b-ok'; }
function sCls(s) { return ['s-ok','s-warn','s-crit','s-unk'][s]||'s-unk'; }
function aCl(s)  { return ['var(--green)','var(--yellow)','var(--red)','var(--muted)'][s]||'var(--muted)'; }
function sshCmd(m) {
  if(m.Type==='windows') return null;
  return 'ssh '+(m.Port&&m.Port!==22?'-p '+m.Port+' ':'')+m.User+'@'+m.Host;
}
function cid(name) { return 'c-'+name.replace(/[^a-zA-Z0-9]/g,'_'); }

// ── State ────────────────────────────────────────────────
const hist={}, charts={};
const MAX_H = 12;
let tabFocused = !document.hidden;

// ── Focus tracking ───────────────────────────────────────
document.addEventListener('visibilitychange', () => {
  tabFocused = !document.hidden;
  document.body.classList.toggle('tab-focused', tabFocused);
  if(tabFocused && ws && ws.readyState===1) {
    // Request immediate refresh when tab comes into focus
    ws.send('refresh');
  }
});
document.body.classList.toggle('tab-focused', tabFocused);

// ── WebSocket ────────────────────────────────────────────
let ws=null, rDelay=1000;
const wsChip=$('ws-chip');

function connect() {
  wsChip.textContent='connecting';
  wsChip.className='chip chip-ws';
  ws=new WebSocket('ws://'+location.host+'/ws');

  ws.onopen=()=>{
    rDelay=1000;
    wsChip.textContent='live';
    wsChip.className='chip chip-ws live';
  };
  ws.onmessage=e=>{
    try {
      const p=JSON.parse(e.data);
      if(p.type==='machines') render(p.data);
    } catch(_){}
  };
  ws.onclose=()=>{
    wsChip.textContent='offline';
    wsChip.className='chip chip-ws dead';
    setTimeout(connect, rDelay);
    rDelay=Math.min(rDelay*2, 30000);
  };
  ws.onerror=()=>ws.close();
}

// ── Render (in-place update, no DOM rebuild) ─────────────
function render(machines) {
  const ph=$('ph'); if(ph) ph.remove();
  let on=0, off=0;

  machines.forEach(m => {
    const isOff = m.Status===3||(m.LastError&&!m.CPU&&!m.MemoryPercent);
    isOff ? off++ : on++;

    // Track history
    if(!hist[m.Name]) hist[m.Name]={cpu:[],mem:[]};
    const h=hist[m.Name];
    h.cpu.push(m.CPU||0); h.mem.push(m.MemoryPercent||0);
    if(h.cpu.length>MAX_H) h.cpu.shift();
    if(h.mem.length>MAX_H) h.mem.shift();

    const id=cid(m.Name);
    const existing=document.getElementById(id);

    if(existing) {
      updateCard(existing, m, isOff);
    } else {
      $('g').appendChild(buildCard(m, isOff));
    }
  });

  $('n-on').textContent=on;
  $('n-off').textContent=off;
  $('ts').textContent=new Date().toLocaleTimeString();
}

// ── In-place card update (no rebuild) ────────────────────
function updateCard(card, m, isOff) {
  const status=m.Status!=null?m.Status:3;
  card.className='card'+(isOff?' offline':'');

  // Accent bar
  const accent=card.querySelector('.card-accent');
  if(accent) accent.style.background=aCl(status);

  // Status dot
  const dot=card.querySelector('.s-dot');
  if(dot) dot.className='s-dot '+sCls(status);

  // Metrics (update values + bar widths in place)
  const rows=card.querySelectorAll('.m-row');
  if(!isOff) {
    updateMetricRow(rows[0], m.CPU);
    updateMetricRow(rows[1], m.MemoryPercent);
    if(rows[2] && m.DiskTotal) updateMetricRow(rows[2], m.DiskPercent);

    // Update value text
    const vals=card.querySelectorAll('.m-val');
    if(vals[0]) vals[0].textContent=(m.CPU||0).toFixed(0)+'%';
    if(vals[1]) vals[1].textContent=m.MemoryTotal?fmtB(m.MemoryUsed)+'/'+fmtB(m.MemoryTotal):(m.MemoryPercent||0).toFixed(0)+'%';
    if(vals[2]&&m.DiskTotal) vals[2].textContent=fmtB(m.DiskUsed)+'/'+fmtB(m.DiskTotal);
  }

  // GPU
  const gpuVals=card.querySelectorAll('.gpu-sec .m-val');
  if(gpuVals.length>=2 && m.GPUs && m.GPUs.length) {
    const au=m.GPUs.reduce((s,g)=>s+g.UtilPercent,0)/m.GPUs.length;
    const am=m.GPUs.reduce((s,g)=>s+g.MemPercent,0)/m.GPUs.length;
    gpuVals[0].textContent=au.toFixed(0)+'%';
    gpuVals[1].textContent=am.toFixed(0)+'%';
    const gpuRows=card.querySelectorAll('.gpu-sec .m-row');
    updateMetricRow(gpuRows[0], au);
    updateMetricRow(gpuRows[1], am);
  }

  // Footer
  const footVals=card.querySelectorAll('.foot-v');
  let fi=0;
  if(m.UptimeSeconds>0 && footVals[fi]) footVals[fi++].textContent=fmtUp(m.UptimeSeconds);
  if(m.Docker && footVals[fi]) footVals[fi++].textContent=m.Docker.Running+'/'+m.Docker.Total;

  // Sparkline update (in place, no rebuild)
  if(!isOff && charts[m.Name]) {
    const c=charts[m.Name];
    const h=hist[m.Name];
    c.data.labels=h.cpu.map((_,i)=>i);
    c.data.datasets[0].data=[...h.cpu];
    c.data.datasets[1].data=[...h.mem];
    c.update('none'); // no animation for smooth updates
  }
}

function updateMetricRow(row, pct) {
  if(!row) return;
  const fill=row.querySelector('.bar-f');
  if(fill) {
    fill.style.width=Math.min(100,pct||0).toFixed(1)+'%';
    fill.className='bar-f '+bCls(pct||0);
  }
}

// ── Build card (first render only) ───────────────────────
function buildCard(m, isOff) {
  const status=m.Status!=null?m.Status:3;
  const id=cid(m.Name);

  const card=el('div','card'+(isOff?' offline':''));
  card.id=id;

  // Accent
  const accent=el('div','card-accent');
  accent.style.background=aCl(status);
  card.appendChild(accent);

  // Head
  const head=el('div','card-head');
  const name=el('div','card-name');
  const dot=el('div','s-dot '+sCls(status));
  const nm=el('span'); nm.textContent=m.Name;
  name.appendChild(dot); name.appendChild(nm);
  const tag=el('span','type-tag'); tag.textContent=m.Type||'?';
  head.appendChild(name); head.appendChild(tag);
  card.appendChild(head);

  // Metrics
  const metrics=el('div','metrics');
  if(isOff) {
    const msg=el('div','off-msg'); msg.textContent='UNREACHABLE';
    const ts=el('div','off-ts'); ts.textContent='Last seen: '+fmtAgo(m.LastUpdate);
    metrics.appendChild(msg); metrics.appendChild(ts);
  } else {
    metrics.appendChild(mkRow('CPU',m.CPU,(m.CPU||0).toFixed(0)+'%'));
    const memS=m.MemoryTotal?fmtB(m.MemoryUsed)+'/'+fmtB(m.MemoryTotal):(m.MemoryPercent||0).toFixed(0)+'%';
    metrics.appendChild(mkRow('MEM',m.MemoryPercent,memS));
    if(m.DiskTotal) metrics.appendChild(mkRow('DSK',m.DiskPercent,fmtB(m.DiskUsed)+'/'+fmtB(m.DiskTotal)));
  }
  card.appendChild(metrics);

  // Spark
  if(!isOff) {
    const sw=el('div','spark');
    const cv=document.createElement('canvas');
    cv.id='sp-'+id;
    sw.appendChild(cv);
    card.appendChild(sw);
  }

  // GPU
  if(!isOff && m.GPUs && m.GPUs.length) {
    const gs=el('div','gpu-sec');
    const gl=el('div','gpu-tag'); gl.textContent='GPU x'+m.GPUs.length;
    gs.appendChild(gl);
    const au=m.GPUs.reduce((s,g)=>s+g.UtilPercent,0)/m.GPUs.length;
    const am=m.GPUs.reduce((s,g)=>s+g.MemPercent,0)/m.GPUs.length;
    gs.appendChild(mkRow('UTIL',au,au.toFixed(0)+'%'));
    gs.appendChild(mkRow('VRAM',am,am.toFixed(0)+'%'));
    card.appendChild(gs);
  }

  // Footer
  const items=[];
  if(!isOff) {
    if(m.UptimeSeconds>0) items.push(['UP',fmtUp(m.UptimeSeconds)]);
    if(m.Docker) items.push(['DOCK',m.Docker.Running+'/'+m.Docker.Total]);
    if(m.MikroTik) items.push(['WiFi',m.MikroTik.WiFiClients+'cl']);
  }
  if(items.length) {
    const ft=el('div','card-foot');
    items.forEach(([l,v])=>{
      const s=el('span'); s.textContent=l+' ';
      const vs=el('span','foot-v'); vs.textContent=v;
      s.appendChild(vs); ft.appendChild(s);
    });
    card.appendChild(ft);
  }

  // SSH tooltip
  const cmd=sshCmd(m);
  if(cmd) {
    const tip=el('div','ssh-tip'); tip.textContent=cmd;
    card.appendChild(tip);
    card.style.cursor='pointer';
    card.addEventListener('click',()=>{
      navigator.clipboard.writeText(cmd).catch(()=>{});
      card.style.borderColor='var(--cyan)';
      setTimeout(()=>card.style.borderColor='',300);
    });
  }

  // Init chart after DOM insert (deferred)
  requestAnimationFrame(()=>initChart(m.Name,'sp-'+id));

  return card;
}

function mkRow(label, pct, valStr) {
  const row=el('div','m-row');
  const lbl=el('div','m-lbl'); lbl.textContent=label;
  const trk=el('div','bar-t');
  const fill=el('div','bar-f '+bCls(pct||0));
  fill.style.width=Math.min(100,pct||0).toFixed(1)+'%';
  trk.appendChild(fill);
  const val=el('div','m-val'); val.textContent=valStr;
  row.appendChild(lbl); row.appendChild(trk); row.appendChild(val);
  return row;
}

// ── Chart.js sparklines ──────────────────────────────────
function initChart(name, canvasId) {
  const cv=document.getElementById(canvasId);
  if(!cv || charts[name]) return;
  const h=hist[name]||{cpu:[],mem:[]};
  charts[name]=new Chart(cv, {
    type:'line',
    data:{
      labels:h.cpu.map((_,i)=>i),
      datasets:[
        {data:[...h.cpu],borderColor:'#06b6d4',borderWidth:1.2,pointRadius:0,fill:true,backgroundColor:'rgba(6,182,212,0.06)',tension:0.3},
        {data:[...h.mem],borderColor:'#8b5cf6',borderWidth:1.2,pointRadius:0,fill:true,backgroundColor:'rgba(139,92,246,0.06)',tension:0.3}
      ]
    },
    options:{
      animation:false,responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false,min:0,max:100}}
    }
  });
}

// ── Boot ─────────────────────────────────────────────────
fetch('/api/machines').then(r=>r.json()).then(d=>{if(d&&d.length)render(d)}).catch(()=>{});
connect();
</script>
</body>
</html>
